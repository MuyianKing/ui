name: npm publish

# 发布版本触发
on:
  workflow_dispatch:
  push:
    tags:
      - v*

permissions:
  contents: write # 写权限用于创建 GitHub Release
  id-token: write # OIDC Trusted Publishing 必需，允许 workflow 请求 OIDC 令牌

jobs:
  publish:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          # npm 11.5.1+ 才支持 OIDC Trusted Publishing，Node 24 自带该版本；
          # 低版本 npm 会静默退化为匿名发布
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: pnpm i
        run: pnpm i --frozen-lockfile

      - name: pnpm build
        run: pnpm build

      - name: npm publish
        # 带 - 的版本号（0.0.1-beta.7）必须走 beta，否则会把 latest 覆盖成预发布版
        run: |
          cd ./dist
          version=$(node -p "require('./package.json').version")
          case "$version" in
            *-*) tag=beta ;;
            *)   tag=latest ;;
          esac
          echo "publishing $version with dist-tag $tag"
          # OIDC Trusted Publishing：不带任何静态 token，npm 用 GitHub 签发的 OIDC 令牌换取短期凭证
          npm publish --tag "$tag"

      # 只在 tag 触发时创建 Release；workflow_dispatch 没有 tag 上下文，自动跳过
      - name: Automatic Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: marvinpinto/action-automatic-releases@v1.2.1
        with:
          repo_token: '${{ secrets.GITHUB_TOKEN }}'
          prerelease: ${{ contains(github.ref_name, 'beta') }}
